name: C/C++ CI

on:
  create:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        c_compiler: [gcc, clang]
        configuration:
          - config=debug
          - config=release
          - config=debug SETGID=Y
          - config=release SETGID=Y
          - config=debug SDLPDCURSES=Y
          - config=release SDLPDCURSES=Y

    steps:
      - uses: actions/checkout@v7
      - name: Update apt cache
        run: sudo apt update
      - name: Install dependencies
        run: sudo apt install gettext libglib2.0-dev pandoc libunwind-dev
      - name: Install PDCurses dependencies
        run: sudo apt install libsdl2-dev libsdl2-ttf-dev
        if: contains(matrix.configuration, 'SDLPDCURSES=Y')
      - name: Build ${{ matrix.configuration }}
        run: make ${{ matrix.configuration }} dist
      - name: Release
        uses: softprops/action-gh-release@v3
        # unless the game is rock-solid deliver the debug build
        if: github.ref_type == 'tag' && matrix.c_compiler == 'gcc' && matrix.configuration == 'config=debug'
        with:
          files: nlarn-*.tar.gz

  build-deb:
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag'
    steps:
      - uses: actions/checkout@v7
      - name: Update apt cache
        run: sudo apt update
      - name: Install packaging dependencies
        run: sudo apt install build-essential debhelper devscripts gettext libglib2.0-dev libncurses-dev libunwind-dev pandoc zlib1g-dev
      - name: Set package version
        run: dch --newversion "$(make -s version)-1" --distribution unstable "Automated build."
      - name: Build .deb
        run: dpkg-buildpackage -us -uc -b
      - name: Move package
        run: mv ../nlarn_*.deb .
      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          files: nlarn_*.deb

  build-rpm:
    runs-on: ubuntu-latest
    container: fedora:latest
    if: github.ref_type == 'tag'
    steps:
      # git must be present before checking out, otherwise actions/checkout
      # silently falls back to downloading a plain tarball via the GitHub
      # REST API, which leaves the workspace without a .git directory.
      - name: Install packaging dependencies
        run: dnf install -y rpm-build gcc gettext glib2-devel ncurses-devel zlib-devel git make
      - uses: actions/checkout@v7
      - name: Build .rpm
        run: |
          VERSION=$(make -s version | tr '-' '.')
          mkdir -p rpmbuild/{SOURCES,SPECS,BUILD,RPMS,SRPMS,BUILDROOT}
          sed "s/^Version:.*/Version: $VERSION/" nlarn.spec > rpmbuild/SPECS/nlarn.spec
          git archive --prefix nlarn-$VERSION/ --format=tar HEAD | gzip > rpmbuild/SOURCES/nlarn-$VERSION.tar.gz
          rpmbuild --define "_topdir $PWD/rpmbuild" -bb rpmbuild/SPECS/nlarn.spec
      - name: Move package
        run: mv rpmbuild/RPMS/*/nlarn-[0-9]*.rpm .
      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          files: nlarn-[0-9]*.rpm

  build-windows:
    runs-on: windows-latest
    strategy:
      matrix:
        configuration:
          - config=debug
          - config=release
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Install pandoc
        uses: crazy-max/ghaction-chocolatey@v4
        with:
          args: install pandoc
      - uses: msys2/setup-msys2@v2
        with:
          path-type: inherit
          msystem: UCRT64
          update: true
          install: >
            git
            make
            zip
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-gettext
            mingw-w64-ucrt-x86_64-glib2
            mingw-w64-ucrt-x86_64-ncurses
            mingw-w64-ucrt-x86_64-nsis
            mingw-w64-ucrt-x86_64-pkg-config
            mingw-w64-ucrt-x86_64-SDL2
            mingw-w64-ucrt-x86_64-SDL2_ttf
            mingw-w64-ucrt-x86_64-zlib
      - uses: actions/checkout@v7
      - name: Build ${{ matrix.configuration }}
        run: make SDLPDCURSES=Y ${{ matrix.configuration }} dist
      - name: Release
        uses: softprops/action-gh-release@v3
        # unless the game is rock-solid deliver the debug build
        if: github.ref_type == 'tag' && matrix.configuration == 'config=debug'
        with:
          files: |
            nlarn-*.zip
            nlarn-*.exe

  build-macos:
    runs-on: macos-15-intel
    strategy:
      matrix:
        configuration:
          # FIXME: building with ncurses is broken
          #          - config=debug
          #          - config=release
          - config=debug SDLPDCURSES=Y
          - config=release SDLPDCURSES=Y
    env:
      PKG_CONFIG_PATH: /opt/homebrew/opt/ncurses/lib/pkgconfig
    steps:
      - uses: actions/checkout@v7
      - name: Update brew cache
        run: brew update
      - name: Install dependencies
        run: brew install create-dmg dylibbundler gettext glib ncurses pandoc pkg-config sdl2 sdl2_ttf
      - name: Build ${{ matrix.configuration }}
        run: make ${{ matrix.configuration }} dist
      - name: Release
        uses: softprops/action-gh-release@v3
        # unless the game is rock-solid deliver the debug build
        if: github.ref_type == 'tag' && matrix.configuration == 'config=debug SDLPDCURSES=Y'
        with:
          files: nlarn-*.dmg
